<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Генератор Вайба</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .bg-blur {
      position: absolute;
      width: 340px;
      height: 340px;
      background: linear-gradient(135deg, #ff4d6d 0%, #a855f7 50%, #6366f1 100%);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 1;
      animation: float 7s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translate(-20px, -20px) scale(1); }
      100% { transform: translate(20px, 20px) scale(1.1); }
    }

    .player-card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 360px;
      padding: 28px 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .cover-art {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
      border-radius: 12px;
      outline: none;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .vibe-btn {
      color: #0f172a;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .vibe-btn:active {
      transform: scale(0.97);
    }

    .app-link-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .app-link-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>

  <div class="bg-blur"></div>

  <div class="player-card">
    <div class="cover-art">🎵</div>
    <h2 id="track-title">Нажми кнопку, чтобы поймать вайб</h2>

    <audio id="audio-player" controls playsinline preload="metadata"></audio>

    <div class="btn-group">
      <button id="vibe-btn" class="vibe-btn">🎲 Включить случайный вайб</button>
      <button id="app-btn" class="app-link-btn">📱 Открыть приложение</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const vibeBtn = document.getElementById('vibe-btn');
    const appBtn = document.getElementById('app-btn');
    const trackTitle = document.getElementById('track-title');
    const audioPlayer = document.getElementById('audio-player');

    const APP_URL = "https://semavahid-art.github.io/vika-app/";

    // Функция кодирования спецсимволов и кириллицы для jsDelivr
    function getCdnUrl(filename) {
      return `https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/${encodeURIComponent(filename)}`;
    }

    const myTracks = [
      { title: "Shape of You", performer: "Ed Sheeran", src: getCdnUrl("01 Ed Sheeran - Shape of You.mp3") },
      { title: "Дорога", performer: "L'One", src: getCdnUrl("02 L One - Дорога.mp3") },
      { title: "Every Breath You Take", performer: "The Police", src: getCdnUrl("04 The Police - Every Breath You Take.mp3") },
      { title: "Perfect", performer: "Ed Sheeran", src: getCdnUrl("05 Ed Sheeran - Perfect.mp3") },
      { title: "Skyfall", performer: "Adele", src: getCdnUrl("Adele - Skyfall.mp3") },
      { title: "Кавалерия", performer: "By Индия", src: getCdnUrl("By Индия - кавалерия.mp3") },
      { title: "Люби меня так", performer: "By Индия", src: getCdnUrl("By Индия - люби меня так.mp3") },
      { title: "You", performer: "Nina Nikolina", src: getCdnUrl("Nicolina_-_You_(mp3.pm).mp3") },
      { title: "Кухни", performer: "Бонд с кнопкой", src: getCdnUrl("Бонд с кнопкой - Кухни.mp3") },
      { title: "Яркий Я", performer: "Дискотека Авария", src: getCdnUrl("Дискотека Авария - Яркий Я.mp3") },
      { title: "Где прошла ты", performer: "Кравц", src: getCdnUrl("Кравц - Где прошла ты.mp3") },
      { title: "Случайности не случайны", performer: "Мот", src: getCdnUrl("Мот - Случайности не случайны.mp3") },
      { title: "Минута", performer: "Рубеж Веков", src: getCdnUrl("Рубеж Веков - Минута.mp3") },
      { title: "10", performer: "Эндшпиль", src: getCdnUrl("Эндшпиль - 10.mp3") }
    ];

    let currentTrackIndex = -1;

    function playRandomVibe() {
      if (myTracks.length === 0) {
        if (trackTitle) trackTitle.textContent = "Список треков пуст";
        return;
      }

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * myTracks.length);
      } while (myTracks.length > 1 && randomIndex === currentTrackIndex);

      currentTrackIndex = randomIndex;
      const track = myTracks[randomIndex];

      audioPlayer.src = track.src;
      if (trackTitle) trackTitle.textContent = `${track.performer} — ${track.title}`;

      audioPlayer.load();

      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Ошибка автовоспроизведения:", err);
          if (trackTitle) trackTitle.textContent = `${track.performer} — ${track.title} (Нажми ▶)`;
        });
      }
    }

    function openApp() {
      if (tg && tg.openLink) {
        tg.openLink(APP_URL);
      } else {
        window.location.href = APP_URL;
      }
    }

    vibeBtn.addEventListener('click', playRandomVibe);
    appBtn.addEventListener('click', openApp);
  </script>
</body>

</html>
