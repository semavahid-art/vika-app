<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Вайба</title>
</head>

<body>

    <h2 id="track-title">Нажми кнопку, чтобы поймать вайб</h2>

    <audio id="audio-player" controls></audio>

    <br><br>

    <button id="vibe-btn">Общий вайб</button>

    <script>
        const vibeBtn = document.getElementById('vibe-btn');
        const trackTitle = document.getElementById('track-title');
        const audioPlayer = document.getElementById('audio-player');

        // Укажи здесь адрес твоего бэкенда/сервера (где крутится MySQL/API бота)
        const API_URL = "https://твой-домен-или-ip.com/api/random-track";

        async function playRandomVibe() {
            try {
                trackTitle.textContent = "Ищем трек...";
                
                // Запрашиваем случайный трек из базы MySQL через бэкенд
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Ошибка сервера");
                
                const track = await response.json();

                trackTitle.textContent = `Сейчас играет: ${track.performer || ''} - ${track.title}`;
                audioPlayer.src = track.src; // Прямая ссылка на mp3 или прокси бота
                audioPlayer.play();

            } catch (error) {
                console.error("Ошибка:", error);
                trackTitle.textContent = "Не удалось загрузить трек из базы";
            }
        }

        vibeBtn.addEventListener('click', playRandomVibe);
    </script>
</body>

</html>
