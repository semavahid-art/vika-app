<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Генератор Вайба</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Анимированный размытый фон */
    .bg-blur {
      position: absolute;
      width: 340px;
      height: 340px;
      background: linear-gradient(135deg, #ff4d6d 0%, #a855f7 50%, #6366f1 100%);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 1;
      animation: float 7s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translate(-20px, -20px) scale(1); }
      100% { transform: translate(20px, 20px) scale(1.1); }
    }

    /* Карточка плеера */
    .player-card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 360px;
      padding: 28px 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .cover-art {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
      border-radius: 12px;
      outline: none;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .vibe-btn {
      color: #0f172a;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .vibe-btn:active {
      transform: scale(0.97);
    }

    .vibe-btn:disabled {
      opacity: 0.6;
    }

    .app-link-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .app-link-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>

  <div class="bg-blur"></div>

  <div class="player-card">
    <div class="cover-art">🎵</div>
    <h2 id="track-title">Нажми кнопку, чтобы поймать вайб</h2>

    <audio id="audio-player" controls playsinline preload="auto"></audio>

    <div class="btn-group">
      <button id="vibe-btn" class="vibe-btn">🎲 Включить случайный вайб</button>
      <button id="app-btn" class="app-link-btn">📱 Открыть приложение</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const vibeBtn = document.getElementById('vibe-btn');
    const appBtn = document.getElementById('app-btn');
    const trackTitle = document.getElementById('track-title');
    const audioPlayer = document.getElementById('audio-player');

    // Ссылка на главное приложение
    const APP_URL = "https://semavahid-art.github.io/vika-app/";

    // ==========================================
    // 🎵 СПИСОК ТВОИХ ТРЕКОВ
    // Сюда добавляй новые треки в таком же формате:
    // ==========================================
   const myTracks = [
  { 
    title: "Perfect", 
    performer: "Ed Sheeran", 
    src: "music/ed_sheeran_shape_of_you.mp3" 
  },
  { 
    title: "Случайности не случайны", 
    performer: "Мот", 
    src: "music/mot_sluchajnosti.mp3"
  },
  { 
    title: "SoundHelix Тест", 
    performer: "Demo", 
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" 
  }
];
    let currentTrackIndex = -1;

    function playRandomVibe() {
      // 1. «Размораживаем» звук на мобилке прямо по тапу
      audioPlayer.play().catch(() => {});

      if (myTracks.length === 0) {
        trackTitle.textContent = "Список треков пуст";
        return;
      }

      // 2. Выбираем случайно, но чтобы не повторялся один и тот же два раза подряд
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * myTracks.length);
      } while (myTracks.length > 1 && randomIndex === currentTrackIndex);

      currentTrackIndex = randomIndex;
      const track = myTracks[randomIndex];

      // 3. Обновляем интерфейс и запускаем трек
      const performer = track.performer ? `${track.performer} — ` : '';
      trackTitle.textContent = `Сейчас играет: ${performer}${track.title}`;
      
      audioPlayer.src = track.src;
      audioPlayer.load();

      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("Ошибка воспроизведения:", error);
          trackTitle.textContent = "Нажми ▶ на плеере";
        });
      }
    }

    function openApp() {
      if (tg && tg.openLink) {
        tg.openLink(APP_URL);
      } else {
        window.location.href = APP_URL;
      }
    }

    vibeBtn.addEventListener('click', playRandomVibe);
    appBtn.addEventListener('click', openApp);
  </script>
</body>

</html>
