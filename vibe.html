<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Генератор Вайба</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .bg-blur {
      position: absolute;
      width: 340px;
      height: 340px;
      background: linear-gradient(135deg, #ff4d6d 0%, #a855f7 50%, #6366f1 100%);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 1;
      animation: float 7s ease-in-out infinite alternate;
      transition: background 1s ease;
    }

    @keyframes float {
      0% { transform: translate(-20px, -20px) scale(1); }
      100% { transform: translate(20px, 20px) scale(1.1); }
    }

    .player-card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 360px;
      padding: 28px 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .cover-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
      transition: transform 0.3s ease;
    }

    .cover-art.playing {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 12px 28px rgba(255, 77, 109, 0.7); }
      100% { transform: scale(1); box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4); }
    }

    .eq-bar-container {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 3px;
      height: 16px;
      align-items: flex-end;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .eq-bar-container.active {
      opacity: 1;
    }

    .eq-bar {
      width: 4px;
      background: #00f2fe;
      border-radius: 2px;
      animation: bounce 0.6s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }

    @keyframes bounce {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
    }

    audio {
      width: 100%;
      margin-bottom: 16px;
      border-radius: 12px;
      outline: none;
    }

    .nav-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px 4px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .nav-btn.active-mode {
      background: rgba(255, 255, 255, 0.35);
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-btn:not(:disabled):active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .vibe-btn {
      color: #0f172a;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .vibe-btn:active {
      transform: scale(0.97);
    }

    .app-link-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .app-link-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Модалки */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px;
      width: 85%;
      max-width: 340px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    .modal-content h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
      margin-bottom: 12px;
    }

    .modal-content p {
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-line;
      color: #cbd5e1;
    }

    .close-modal-btn {
      padding: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Плейлист */
    .playlist-list {
      list-style: none;
      padding: 0;
      text-align: left;
    }

    .playlist-item {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #cbd5e1;
      transition: background 0.2s ease;
    }

    .playlist-item:active, .playlist-item.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div id="bg-blur" class="bg-blur"></div>

  <div class="player-card">
    <div class="cover-wrapper">
      <div id="cover-art" class="cover-art">🎵</div>
      <div id="eq-bar" class="eq-bar-container">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
    </div>

    <h2 id="track-title">Нажми кнопку, чтобы поймать вайб</h2>

    <audio id="audio-player" controls playsinline preload="metadata"></audio>

    <div class="nav-controls">
      <button id="prev-btn" class="nav-btn" title="Предыдущий трек" disabled>⏮️</button>
      <button id="shuffle-btn" class="nav-btn" title="Перемешать">🔀</button>
      <button id="repeat-btn" class="nav-btn" title="Режим повтора">➡️</button>
      <button id="playlist-btn" class="nav-btn" title="Плейлист">📜</button>
      <button id="lyrics-btn" class="nav-btn" title="Послание трека">💬</button>
      <button id="next-btn" class="nav-btn" title="Следующий трек">⏭️</button>
    </div>

    <div class="btn-group">
      <button id="vibe-btn" class="vibe-btn">🎲 Включить случайный вайб</button>
      <button id="app-btn" class="app-link-btn">📱 Открыть приложение</button>
    </div>
  </div>

  <!-- Модальное окно -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modal-title">Заголовок</h3>
      <div id="modal-body" class="modal-body"></div>
      <button id="close-modal-btn" class="close-modal-btn">Закрыть</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function triggerHaptic() {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    const vibeBtn = document.getElementById('vibe-btn');
    const appBtn = document.getElementById('app-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const repeatBtn = document.getElementById('repeat-btn');
    const playlistBtn = document.getElementById('playlist-btn');
    const lyricsBtn = document.getElementById('lyrics-btn');
    const trackTitle = document.getElementById('track-title');
    const audioPlayer = document.getElementById('audio-player');
    const coverArt = document.getElementById('cover-art');
    const eqBar = document.getElementById('eq-bar');
    const bgBlur = document.getElementById('bg-blur');

    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const closeModalBtn = document.getElementById('close-modal-btn');

    const APP_URL = "https://semavahid-art.github.io/vika-app/";

    const myTracks = [


    let historyStack = [];
    let historyIndex = -1;
    let repeatMode = 0; // 0: Sequential, 1: Repeat One
    let isShuffle = false;

    function updateNavButtons() {
      prevBtn.disabled = historyIndex <= 0;
    }

    function applyBgGradient(gradientStr) {
      if (gradientStr) {
        bgBlur.style.background = gradientStr;
      }
    }

    function loadAndPlayTrack(trackIndex, autoPlay = true, seekTime = 0) {
      const track = myTracks[trackIndex];
      audioPlayer.src = track.src;
      if (trackTitle) trackTitle.textContent = `${track.performer} — ${track.title}`;
      
      applyBgGradient(track.bg);
      audioPlayer.load();

      if (seekTime > 0) {
        audioPlayer.currentTime = seekTime;
      }

      if (autoPlay) {
        const playPromise = audioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.log("Ошибка воспроизведения:", err);
            if (trackTitle) trackTitle.textContent = `${track.performer} — ${track.title} (Нажми ▶)`;
          });
        }
      }

      saveState();
      updateNavButtons();
    }

    function playTrackByIndex(index) {
      if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
      }
      historyStack.push(index);
      historyIndex = historyStack.length - 1;
      loadAndPlayTrack(index);
    }

    function playRandomVibe() {
      triggerHaptic();
      if (myTracks.length === 0) return;

      let currentTrackIndex = historyIndex >= 0 ? historyStack[historyIndex] : -1;
      let randomIndex;
      
      do {
        randomIndex = Math.floor(Math.random() * myTracks.length);
      } while (myTracks.length > 1 && randomIndex === currentTrackIndex);

      playTrackByIndex(randomIndex);
    }

    function playNextTrack() {
      triggerHaptic();
      if (repeatMode === 1 && historyIndex >= 0) {
        loadAndPlayTrack(historyStack[historyIndex]);
        return;
      }

      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        loadAndPlayTrack(historyStack[historyIndex]);
      } else if (isShuffle) {
        playRandomVibe();
      } else {
        let current = historyIndex >= 0 ? historyStack[historyIndex] : -1;
        let nextIndex = (current + 1) % myTracks.length;
        playTrackByIndex(nextIndex);
      }
    }

    function playPrevTrack() {
      triggerHaptic();
      if (historyIndex > 0) {
        historyIndex--;
        loadAndPlayTrack(historyStack[historyIndex]);
      }
    }

    function toggleShuffleMode() {
      triggerHaptic();
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active-mode', isShuffle);
    }

    function toggleRepeatMode() {
      triggerHaptic();
      repeatMode = (repeatMode + 1) % 2;
      if (repeatMode === 1) {
        repeatBtn.textContent = "🔂";
        repeatBtn.classList.add('active-mode');
      } else {
        repeatBtn.textContent = "➡️";
        repeatBtn.classList.remove('active-mode');
      }
    }

    function openModal(title, contentHtml) {
      modalTitle.textContent = title;
      modalBody.innerHTML = contentHtml;
      modalOverlay.classList.add('open');
    }

    function closeModal() {
      triggerHaptic();
      modalOverlay.classList.remove('open');
    }

    function showLyrics() {
      triggerHaptic();
      if (historyIndex < 0 || historyStack[historyIndex] === undefined) {
        openModal("Послание трека", "<p>Сначала включи трек!</p>");
      } else {
        const track = myTracks[historyStack[historyIndex]];
        openModal(`${track.performer} — ${track.title}`, `<p>${track.message || "Особое послание для тебя..."}</p>`);
      }
    }

    function showPlaylist() {
      triggerHaptic();
      const currentTrackIndex = historyIndex >= 0 ? historyStack[historyIndex] : -1;
      
      let html = '<ul class="playlist-list">';
      myTracks.forEach((track, index) => {
        const isActive = index === currentTrackIndex ? 'active' : '';
        html += `<li class="playlist-item ${isActive}" onclick="selectFromPlaylist(${index})">
          ${index + 1}. ${track.performer} — ${track.title}
        </li>`;
      });
      html += '</ul>';

      openModal("Плейлист", html);
    }

    window.selectFromPlaylist = function(index) {
      triggerHaptic();
      playTrackByIndex(index);
      closeModal();
    };

    function openApp() {
      triggerHaptic();
      if (tg && tg.openLink) {
        tg.openLink(APP_URL);
      } else {
        window.location.href = APP_URL;
      }
    }

    function saveState() {
      if (historyIndex >= 0) {
        const state = {
          trackIndex: historyStack[historyIndex],
          time: audioPlayer.currentTime || 0,
          volume: audioPlayer.volume,
          isShuffle: isShuffle,
          repeatMode: repeatMode
        };
        localStorage.setItem('vibe_player_state', JSON.stringify(state));
      }
    }

    function restoreState() {
      const saved = localStorage.getItem('vibe_player_state');
      if (saved) {
        try {
          const state = JSON.parse(saved);
          if (state.trackIndex >= 0 && state.trackIndex < myTracks.length) {
            historyStack = [state.trackIndex];
            historyIndex = 0;
            if (state.volume !== undefined) audioPlayer.volume = state.volume;
            if (state.isShuffle) {
              isShuffle = state.isShuffle;
              shuffleBtn.classList.add('active-mode');
            }
            if (state.repeatMode === 1) {
              repeatMode = 1;
              repeatBtn.textContent = "🔂";
              repeatBtn.classList.add('active-mode');
            }
            loadAndPlayTrack(state.trackIndex, false, state.time || 0);
          }
        } catch (e) {
          console.log("Ошибка загрузки состояния", e);
        }
      }
    }

    // События
    vibeBtn.addEventListener('click', playRandomVibe);
    prevBtn.addEventListener('click', playPrevTrack);
    nextBtn.addEventListener('click', playNextTrack);
    shuffleBtn.addEventListener('click', toggleShuffleMode);
    repeatBtn.addEventListener('click', toggleRepeatMode);
    playlistBtn.addEventListener('click', showPlaylist);
    lyricsBtn.addEventListener('click', showLyrics);
    closeModalBtn.addEventListener('click', closeModal);
    appBtn.addEventListener('click', openApp);

    audioPlayer.addEventListener('ended', playNextTrack);

    audioPlayer.addEventListener('play', () => {
      coverArt.classList.add('playing');
      eqBar.classList.add('active');
    });

    audioPlayer.addEventListener('pause', () => {
      coverArt.classList.remove('playing');
      eqBar.classList.remove('active');
      saveState();
    });

    audioPlayer.addEventListener('timeupdate', () => {
      if (Math.floor(audioPlayer.currentTime) % 3 === 0) {
        saveState();
      }
    });

    audioPlayer.addEventListener('volumechange', saveState);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') playPrevTrack();
      if (e.code === 'ArrowRight') playNextTrack();
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
      }
    });

    restoreState();
  </script>
</body>

</html>
