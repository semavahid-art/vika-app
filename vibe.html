<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Генератор Вайба</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .bg-blur {
      position: absolute;
      width: 340px;
      height: 340px;
      background: linear-gradient(135deg, #ff4d6d 0%, #a855f7 50%, #6366f1 100%);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 1;
      animation: float 7s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translate(-20px, -20px) scale(1); }
      100% { transform: translate(20px, 20px) scale(1.1); }
    }

    .player-card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 360px;
      padding: 28px 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .cover-art {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
      transition: transform 0.3s ease;
    }

    .cover-art.playing {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 12px 28px rgba(255, 77, 109, 0.7); }
      100% { transform: scale(1); box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4); }
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
      border-radius: 12px;
      outline: none;
    }

    .nav-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-btn:not(:disabled):active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .vibe-btn {
      color: #0f172a;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .vibe-btn:active {
      transform: scale(0.97);
    }

    .app-link-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .app-link-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>

  <div class="bg-blur"></div>

  <div class="player-card">
    <div id="cover-art" class="cover-art">🎵</div>
    <h2 id="track-title">Нажми кнопку, чтобы поймать вайб</h2>

    <audio id="audio-player" controls playsinline preload="metadata"></audio>

    <div class="nav-controls">
      <button id="prev-btn" class="nav-btn" title="Предыдущий трек" disabled>⏮️ Назад</button>
      <button id="next-btn" class="nav-btn" title="Следующий трек">Вперёд ⏭️</button>
    </div>

    <div class="btn-group">
      <button id="vibe-btn" class="vibe-btn">🎲 Включить случайный вайб</button>
      <button id="app-btn" class="app-link-btn">📱 Открыть приложение</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function triggerHaptic() {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    const vibeBtn = document.getElementById('vibe-btn');
    const appBtn = document.getElementById('app-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const trackTitle = document.getElementById('track-title');
    const audioPlayer = document.getElementById('audio-player');
    const coverArt = document.getElementById('cover-art');

    const APP_URL = "https://semavahid-art.github.io/vika-app/";

    const myTracks = [
      { title: "Shape of You", performer: "Ed Sheeran", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("01 Ed Sheeran - Shape of You.mp3") },
      { title: "Дорога", performer: "L'One", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("02 L One - Дорога.mp3") },
      { title: "Every Breath You Take", performer: "The Police", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("04 The Police - Every Breath You Take.mp3") },
      { title: "Perfect", performer: "Ed Sheeran", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("05 Ed Sheeran - Perfect.mp3") },
      { title: "Skyfall", performer: "Adele", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Adele - Skyfall.mp3") },
      { title: "Кавалерия", performer: "By Индия", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("By Индия - кавалерия.mp3") },
      { title: "Люби меня так", performer: "By Индия", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("By Индия - люби меня так.mp3") },
      { title: "You", performer: "Nina Nikolina", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Nicolina_-_You_(mp3.pm).mp3") },
      { title: "Кухни", performer: "Бонд с кнопкой", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Бонд с кнопкой - Кухни.mp3") },
      { title: "Яркий Я", performer: "Дискотека Авария", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Дискотека Авария - Яркий Я.mp3") },
      { title: "Где прошла ты", performer: "Кравц", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Кравц - Где прошла ты.mp3") },
      { title: "Случайности не случайны", performer: "Мот", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Мот - Случайности не случайны.mp3") },
      { title: "Минута", performer: "Рубеж Веков", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Рубеж Веков - Минута.mp3") },
      { title: "Не надо быть сильной", performer: "Миша Марвин", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Миша_Марвин_Не_надо_быть_сильной.mp3") },
      { title: "10", performer: "Эндшпиль", src: "https://cdn.jsdelivr.net/gh/semavahid-art/vika-app@main/music/" + encodeURIComponent("Эндшпиль - 10.mp3") }
    ];

    let historyStack = [];
    let historyIndex = -1;

    function updateNavButtons() {
      prevBtn.disabled = historyIndex <= 0;
    }

    function loadAndPlayTrack(trackIndex) {
      const track = myTracks[trackIndex];
      audioPlayer.src = track.src;
      if (trackTitle) trackTitle.textContent = `${track.performer} — ${track.title}`;

      audioPlayer.load();

      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Ошибка воспроизведения:", err);
          if (trackTitle) trackTitle.textContent = `${track.performer} — ${track.title} (Нажми ▶)`;
        });
      }

      updateNavButtons();
    }

    function playRandomVibe() {
      triggerHaptic();
      if (myTracks.length === 0) return;

      let currentTrackIndex = historyIndex >= 0 ? historyStack[historyIndex] : -1;
      let randomIndex;
      
      do {
        randomIndex = Math.floor(Math.random() * myTracks.length);
      } while (myTracks.length > 1 && randomIndex === currentTrackIndex);

      if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
      }

      historyStack.push(randomIndex);
      historyIndex = historyStack.length - 1;

      loadAndPlayTrack(randomIndex);
    }

    function playPrevTrack() {
      triggerHaptic();
      if (historyIndex > 0) {
        historyIndex--;
        loadAndPlayTrack(historyStack[historyIndex]);
      }
    }

    function playNextTrack() {
      triggerHaptic();
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        loadAndPlayTrack(historyStack[historyIndex]);
      } else {
        playRandomVibe();
      }
    }

    function openApp() {
      triggerHaptic();
      if (tg && tg.openLink) {
        tg.openLink(APP_URL);
      } else {
        window.location.href = APP_URL;
      }
    }

    // Слушатели событий
    vibeBtn.addEventListener('click', playRandomVibe);
    prevBtn.addEventListener('click', playPrevTrack);
    nextBtn.addEventListener('click', playNextTrack);
    appBtn.addEventListener('click', openApp);

    // Автопереключение по завершению трека
    audioPlayer.addEventListener('ended', () => {
      playNextTrack();
    });

    // Анимация обложки при воспроизведении / паузе
    audioPlayer.addEventListener('play', () => coverArt.classList.add('playing'));
    audioPlayer.addEventListener('pause', () => coverArt.classList.remove('playing'));

    // Управление с клавиатуры (стрелки + пробел)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') playPrevTrack();
      if (e.code === 'ArrowRight') playNextTrack();
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
      }
    });
  </script>
</body>

</html>
